[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideal-dsl"
version = "1.0.0"
description = "DSL didattico per ideali polinomiali e basi di Groebner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["lark>=1.1,<2"]

[project.scripts]
idealdsl = "main:main"

[tool.setuptools]
py-modules = [
  "Ordinamento",
  "Parser",
  "domain",
  "dsl_ast",
  "dsl_parser",
  "ideals",
  "interpreter",
  "main",
  "monomial",
  "polynomial",
  "state",
]
